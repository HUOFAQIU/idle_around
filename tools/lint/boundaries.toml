# 层表：谁可以读谁。
# 同层永远放行；目标不属于任何层时默认放行（assets/、mods/、user://）。
# 层按最长前缀匹配，子层因此能从父目录里独立出来。
# 目标写目录前缀（带 /）或具体文件；reads 写 "*" 表示全部放行。

[[layer]]
name = "tools"
paths = ["tools/", "engine_tools/"]
reads = ["*"]

[[layer]]
name = "main"
paths = ["main/"]
reads = ["*"]

[[layer]]
name = "test-api"
paths = ["scripts/test_api.gd", "scripts/test_api/"]
reads = ["*"]

[[layer]]
name = "windows"
paths = ["windows/"]
reads = [
	"scripts/",
	"game/",
	"godot_gas/",
	"addons/",
	"base_mods/",
	"assets/",
	"main/panel_manager.gd",
]

[[layer]]
name = "script"
paths = ["scripts/"]
reads = [
	"game/",
	"godot_gas/",
	"addons/",
	"base_mods/",
	"assets/",
	"scripts/test_api.gd",
	"scripts/test_api/",
]

[[layer]]
name = "content-def"
paths = ["game/content/"]
reads = [
	"game/inventory/",
	"godot_gas/",
	"addons/",
	"assets/",
	"scripts/game_colors.gd",
	"scripts/debug/",
	"scripts/save/",
	"scripts/mod/",
	"scripts/collection_db.gd",
]

[[layer]]
name = "domain"
paths = ["game/"]
reads = [
	"game/content/",
	"godot_gas/",
	"addons/",
	"assets/",
	"scripts/game_colors.gd",
	"scripts/debug/",
	"scripts/save/",
	"scripts/collection_db.gd",
]

[[layer]]
name = "gas"
paths = ["godot_gas/"]
reads = ["addons/"]

[[layer]]
name = "content"
paths = ["base_mods/"]
reads = [
	"game/",
	"godot_gas/",
	"addons/",
	"assets/",
]

[autoload]
ModLoader = "scripts/mod/mod_loader.gd"
GameGlobal = "scripts/GameGlobal.gd"
GBIS = "game/inventory/grid_base_inventory_system/core/grid_base_inventory_system.gd"
GameplayCueManager = "addons/GodotGAS/managers/gameplay_cue_manager.gd"
ModCueRegistrar = "scripts/mod/mod_cue_registrar.gd"
CollectionDB = "scripts/collection_db.gd"
CombatTelemetry = "scripts/debug/combat_telemetry.gd"
SoulRuntimeDB = "game/battle/soul_runtime_db.gd"
Warehouse = "scripts/warehouse.gd"
MapBoard = "scripts/map_board.gd"
SaveManager = "scripts/save/save_manager.gd"
GameFlow = "game/flow/game_flow.gd"
